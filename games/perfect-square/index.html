<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PERFECT SQUARE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <a class="back" href="../../index.html">← Trang chủ</a>
  <h1>PERFECT SQUARE</h1>

  <section id="vMenu">
    <p class="hint">Chọn độ khó</p>
    <div class="diffs" id="diffBox"></div>
  </section>

  <section id="vList" hidden>
    <h2 id="listTitle"></h2>
    <div class="lvgrid" id="lvGrid"></div>
    <div class="tools"><button id="listBack">← Chọn độ khó</button></div>
  </section>

  <section id="vGame" hidden>
    <div class="info">
      <div><b id="lvName">EASY · Level 1</b><small>Màn hiện tại</small></div>
      <div><b id="time">0:00</b><small>Thời gian</small></div>
      <div><b id="cnt">0/0</b><small>Cụm đã đặt</small></div>
    </div>
    <div class="tools">
      <button id="bRestart">⟲ Restart</button>
      <button id="bRotate">⟳ Rotate</button>
      <button id="bReset">↩ Reset</button>
      <button id="bCheck">✔ Check</button>
      <button id="bNext" class="p" disabled>Next Level ▶</button>
    </div>
    <div class="msg" id="msg"></div>
    <!-- Sân chơi hỗn loạn: khung đích + các cụm vứt lung tung, kéo thả tự do -->
    <div class="arena" id="arena">
      <div id="board">
        <div id="win"><div class="wt" id="wt">LEVEL COMPLETED!</div><div id="wtime"></div>
          <div class="wb"><button id="wNext" class="p">Next Level ▶</button><button id="wAgain">Chơi lại</button></div></div>
      </div>
      <div id="pv"></div>
      <div id="layer"></div>
    </div>
    <div class="tools"><button id="gameBack">← Danh sách level</button></div>
  </section>
</div>
<script src="levels.js"></script>
<script src="logic.js"></script>
<script src="script.js"></script>
</body>
</html>
